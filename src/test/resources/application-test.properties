# Test profile — in-memory H2 so the build runs anywhere (local + Railway/CI)
# without needing a live PostgreSQL connection.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Dummy JWT secret so any JWT config can initialize during tests.
app.jwt.secret=test-secret-please-override-in-real-environments-0123456789
