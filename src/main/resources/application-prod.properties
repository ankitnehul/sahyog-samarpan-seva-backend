# Production profile — used on Railway. All values injected via Railway variables.

# Do not auto-create/drop schema in production by default.
# Switch to "update" temporarily for the first deploy if you want JPA to create tables,
# then move to "validate" once schema is stable (or adopt Flyway later).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=INFO
