spring.application.name=seva-backend

# Active profile (override with SPRING_PROFILES_ACTIVE). Defaults to local dev.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource (values supplied per-profile / via environment variables)
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT (used from Phase 2 onwards)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial admin seed (only when users table is empty)
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# CORS allowed origins (comma-separated). Empty in setup; set to Vercel URL in Phase 5.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Actuator: expose only health for Railway health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Server port (Railway injects PORT at runtime)
server.port=${PORT:8080}
